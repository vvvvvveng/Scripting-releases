name: 自动生成作品合集

on:
  push:
    branches: [main]
  workflow_dispatch:          # 支持在 Actions 页面手动触发
  schedule:
    - cron: '0 0 * * *'       # 每天 0 点自动刷新一次

permissions:
  contents: write             # 允许把生成结果提交回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 拉取完整历史，才能拿到 .scripting 文件上次上传的 commit 时间
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 运行生成脚本
        run: python scripts/build_gallery.py
      - name: 提交生成的列表
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md gallery.html
          git diff --quiet && git diff --cached --quiet || git commit -m "🤖 自动更新作品合集"
          git push